<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>week 8</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>
        today's good luck charm :
    </h1>
    <br>
    <div class="button">
        <button id="hazel">click me</button>
        <img id="resultImage">
    </div>

    <script>

        let image=document.querySelector('#resultImage')

        function match() {
            let roll=Math.random()
            if (roll<0.25) {
                image.src="melody.jpg"
            } else if(roll<0.5){
                image.src="kuromi.jpg"
            } else if(roll<0.75){
                image.src="hellokitty.jpg"
            } else{
                image.src="cinnamoroll.jpg"
            }
        }

        hazel.addEventListener('click', match)

    </script>

    </div>
    
</body>

</html>
